<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#EFEAE0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74C2BB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#74C2BB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#skyR)"/>
  <circle cx="205" cy="185" r="150" fill="url(#glowR)"/>

  <!-- concentric ripples, echoing "entre le stimulus et la réponse, il y a un espace" -->
  <g fill="none" stroke-linecap="round">
    <circle cx="205" cy="185" r="34" stroke="#1F3F52" stroke-width="1.6" opacity="0.9"/>
    <circle cx="205" cy="185" r="62" stroke="#235A78" stroke-width="1.3" opacity="0.7"/>
    <circle cx="205" cy="185" r="92" stroke="#1F6E68" stroke-width="1.1" opacity="0.55"/>
    <circle cx="205" cy="185" r="124" stroke="#6E93A8" stroke-width="0.9" opacity="0.4"/>
    <circle cx="205" cy="185" r="158" stroke="#6E93A8" stroke-width="0.7" opacity="0.25"/>
    <circle cx="205" cy="185" r="194" stroke="#6E93A8" stroke-width="0.6" opacity="0.15"/>
  </g>

  <circle cx="205" cy="185" r="6" fill="#A1801F"/>

  <!-- faint diagonal texture, echoing the site's background pattern -->
  <g stroke="#1F3F52" stroke-width="0.6" opacity="0.04">
    <line x1="-20" y1="420" x2="320" y2="80"/>
    <line x1="0" y1="420" x2="340" y2="80"/>
    <line x1="20" y1="420" x2="360" y2="80"/>
  </g>
</svg>
