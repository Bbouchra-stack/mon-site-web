<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="62%" stop-color="#EFEAE0"/>
      <stop offset="100%" stop-color="#E4DCCB"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3BE73" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E3BE73" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#sky)"/>

  <!-- faint diagonal texture, echoing the site's background pattern -->
  <g stroke="#1F3F52" stroke-width="0.6" opacity="0.05">
    <line x1="-20" y1="420" x2="320" y2="80"/>
    <line x1="0" y1="420" x2="340" y2="80"/>
    <line x1="20" y1="420" x2="360" y2="80"/>
    <line x1="-40" y1="420" x2="300" y2="80"/>
  </g>

  <!-- rising sun / horizon glow -->
  <circle cx="205" cy="240" r="100" fill="url(#glow)" opacity="0.6"/>
  <circle cx="205" cy="240" r="7" fill="#A1801F"/>

  <!-- horizon line -->
  <line x1="0" y1="258" x2="300" y2="258" stroke="#6E93A8" stroke-width="0.75" opacity="0.35"/>

  <!-- distant ridge -->
  <path d="M0 250 L38 214 L70 236 L108 196 L150 232 L190 202 L228 238 L262 210 L300 246 L300 400 L0 400 Z" fill="#7C9DB0" opacity="0.4"/>

  <!-- mid ridge -->
  <path d="M0 272 L46 224 L86 254 L132 200 L168 244 L214 206 L250 250 L300 218 L300 400 L0 400 Z" fill="#235A78" opacity="0.65"/>

  <!-- foreground peak, echoing the logo's I/mountain mark -->
  <path d="M0 320 L92 168 L138 244 L172 176 L232 288 L300 232 L300 400 L0 400 Z" fill="#1F3F52"/>

  <!-- thin ascending accent line, echoing the logo mark's upward stroke -->
  <line x1="118" y1="400" x2="172" y2="176" stroke="#F7F4EE" stroke-width="1.4" opacity="0.55"/>
</svg>
